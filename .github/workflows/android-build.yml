name: Android CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: [self-hosted, manupa-hnx]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Use the project's Gradle wrapper (8.7) so CI matches local builds and
      # satisfies AGP 8.5.1 (requires Gradle 8.7+). Do NOT pin an older gradle
      # version here — that is what made this pipeline fail at setup.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Lint Checks
        run: ./gradlew lintDebug --continue

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frigate-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
